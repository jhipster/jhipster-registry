name: Build
on: [push, pull_request]
jobs:
    pipeline:
        name: JHipster Registry build
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
        timeout-minutes: 40
        env:
            NODE_VERSION: 14.16.0
            SPRING_OUTPUT_ANSI_ENABLED: DETECT
            JHI_DISABLE_WEBPACK_LOGS: true
            NG_CLI_ANALYTICS: false
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'maven'
            - name: Install node.js packages
              run: npm install
            - name: Run backend test
              run: |
                  chmod +x mvnw
                  ./mvnw -ntp clean verify -P-webapp
            - name: Run frontend test
              run: npm run test
            - name: Package application
              run: ./mvnw -ntp package -Pprod -DskipTests
            - name: Start Keycloak
              run: docker compose -f src/main/docker/keycloak.yml up --wait
            - name: Start the registry with the oauth2 profile
              run: |
                  java -jar target/jhipster-registry-*.jar --spring.profiles.active=dev,oauth2 > target/registry-oauth2.log 2>&1 &
                  npm run ci:server:await
            - name: Check that sign-in redirects to Keycloak
              run: |
                  location=$(curl -s -o /dev/null -w '%{redirect_url}' http://localhost:8761/oauth2/authorization/oidc)
                  echo "Redirected to: $location"
                  case "$location" in
                    http://localhost:9080/realms/jhipster/protocol/openid-connect/auth*) ;;
                    *) echo "::error::Expected a redirect to the Keycloak sign-in page"; exit 1 ;;
                  esac
            - name: Show the registry and Keycloak logs
              if: failure()
              run: |
                  cat target/registry-oauth2.log || true
                  docker compose -f src/main/docker/keycloak.yml logs --tail 100 || true
