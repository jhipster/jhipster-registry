name: Build
on: [push, pull_request]
jobs:
    pipeline:
        name: JHipster Registry build
        runs-on: ubuntu-latest
        if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.pull_request.title, '[skip ci]') && !contains(github.event.pull_request.title, '[ci skip]')"
        timeout-minutes: 40
        env:
            NODE_VERSION: 14.16.0
            SPRING_OUTPUT_ANSI_ENABLED: DETECT
            JHI_DISABLE_WEBPACK_LOGS: true
            NG_CLI_ANALYTICS: false
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
            - uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: 'maven'
            - name: Install node.js packages
              run: npm install
            - name: Run backend test
              run: |
                  chmod +x mvnw
                  ./mvnw -ntp clean verify -P-webapp
            - name: Run frontend test
              run: npm run test
            - name: Package application
              run: ./mvnw -ntp package -Pprod -DskipTests
            - name: Install the Playwright browser
              run: npx playwright install --with-deps chromium
            - name: Start the registry
              env:
                  # The encryption tests need a key
                  ENCRYPT_KEY: e2e-test-key
              run: |
                  java -jar target/jhipster-registry-*.jar --spring.profiles.active=dev > target/registry-jwt.log 2>&1 &
                  echo $! > target/registry.pid
                  npm run ci:server:await
            - name: Run end-to-end tests
              run: npm run e2e
            - name: Stop the registry
              run: |
                  kill "$(cat target/registry.pid)"
                  while curl -s -o /dev/null http://localhost:8761/management/health; do sleep 1; done
            - name: Start Keycloak
              run: docker compose -f src/main/docker/keycloak.yml up --wait
            - name: Start the registry with the oauth2 profile
              run: |
                  java -jar target/jhipster-registry-*.jar --spring.profiles.active=dev,oauth2 > target/registry-oauth2.log 2>&1 &
                  npm run ci:server:await
            - name: Run end-to-end tests with Keycloak
              run: npm run e2e:oauth2
            - name: Show the registry logs
              if: failure()
              run: tail -n 300 target/registry-*.log
            - name: Upload the Playwright report
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: target/playwright
                  retention-days: 7
